name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 20's bundled npm (10.8.x) hits a known resolver bug on a
        # fresh install tree with no lockfile; the package itself needs only
        # Node >=18 (see engines in package.json) — this matrix tests the
        # versions whose npm is not affected.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
